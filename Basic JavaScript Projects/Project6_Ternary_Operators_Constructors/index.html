<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Eligibility Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <!-- External JavaScript File -->
    <script src="JS/main.js"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden">

        <!-- Header Section -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 text-center">
            <div
                class="w-14 h-14 bg-white/10 rounded-full flex items-center justify-center mx-auto mb-3 backdrop-blur-sm border border-white/20">
                <i class="fa-solid me-0.5 fa-check-to-slot text-3xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide">Voting Eligibility Checker</h1>
            <p class="text-blue-100 text-sm mt-1">Interactive JavaScript Ternary Operator</p>
        </div>

        <!-- Form and Content Body -->
        <div class="p-6 space-y-6">

            <!-- Input Form -->
            <form id="votingForm" class="space-y-4">
                <div>
                    <label for="userAge" class="block text-sm font-medium text-slate-300 mb-2">
                        Enter Your Age:
                    </label>
                    <div class="relative">
                        <input type="number" id="userAge" placeholder="e.g., 21" min="0" max="120"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 pl-11 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                            required />
                        <i class="fa-solid fa-user-check absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3 px-6 rounded-xl shadow-lg hover:shadow-blue-500/25 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    <span>Check Eligibility</span>
                    <i class="fa-solid fa-arrow-right text-sm"></i>
                </button>
            </form>

            <!-- Result Banner (Hidden by default) -->
            <div id="resultBox" class="hidden p-4 rounded-xl border transition-all duration-300 flex items-start gap-3">
                <div id="resultIcon" class="text-2xl mt-0.5"></div>
                <div>
                    <h3 id="resultTitle" class="font-semibold text-base"></h3>
                    <p id="resultMessage" class="text-sm mt-0.5 opacity-90"></p>
                </div>
            </div>

            <!-- Code Reference Panel -->
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-2">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Ternary Operator Code
                        Snippet</span>
                    <i class="fa-solid fa-code text-slate-500 text-xs"></i>
                </div>
                <pre
                    class="bg-slate-900/80 p-3 rounded-lg text-xs font-mono text-blue-300 overflow-x-auto border border-slate-800"><code id="codeDisplay">const message = age >= 18 
  ? "You can vote!" 
  : "You are not old enough to vote";</code></pre>
            </div>

        </div>

        <!-- Footer -->
        <div class="bg-slate-900/50 border-t border-slate-800 p-4 text-center text-xs text-slate-500">
            Powered by &copy; ARODOT Global Inc.
        </div>
    </div>

    <button onclick="myFunction()">Click Here</button>
    <p id="Keywords_and_Constructions"></p>

    <p id="Counting" onclick="count_Function()">Click here</p>
</body>

</html>
