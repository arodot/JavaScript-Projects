<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Methods</title>

    <!-- External JavaScript File -->
    <script src="JS/main.js"></script>
</head>

<body>
    <!-- Paragraph element with an id attribute -->
    <p id="Concatenate"></p>

    <!-- Button to execute the JS function -->
    <button onclick="full_Sentence()">Click here for sentence.</button>

    <hr>
    <!--Slice a different part of the existing sentence-->
    <p id="Slice"></p>
    <button onclick="slice_Method()">Click to Here</button>

    <hr>
    <!--converts all characters in a string to uppercase letters without altering the original string-->
    <p id="Upper"></p>
    <button onclick="upper_Method()">Click</button>

    <hr>

    <!-- search() Section -->
    <p id="Search"></p>
    <button onclick="search_Method()">Search Word Position</button>

    <hr>

    <p id="Numbers_to_string"></p>
    <button onclick="string_Method()">Click here</button>

    <hr>
    <p id="Precision"></p>
    <button onclick="precision_Method()">Click to format number</button>

    <!-- toFixed() Section -->
  <p id="Fixed"></p>
  <button onclick="fixed_Method()">Format Decimals</button>

  <hr>

  <!-- valueOf() Section -->
  <p id="Value"></p>
  <button onclick="value_Method()">Get Primitive Value</button>
</body>

</html>
