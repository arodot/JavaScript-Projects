<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <!-- Link to the external CSS file for styling the calculator -->
    <link rel="stylesheet" href="CSS/Calculator_CSS.css">
</head>
<body>

    <div class="calculator">
        <!-- Display Screen -->
        <input type="text" class="calculator-screen" id="screen" disabled />

        <!-- Calculator Keys -->
        <div class="calculator-keys">
            <button type="button" class="operator" onclick="clearScreen()">C</button>
            <button type="button" class="operator" onclick="deleteChar()">DEL</button>
            <button type="button" class="operator" onclick="appendCharacter('/')">&divide;</button>
            <button type="button" class="operator" onclick="appendCharacter('*')">&times;</button>

            <button type="button" onclick="appendCharacter('7')">7</button>
            <button type="button" onclick="appendCharacter('8')">8</button>
            <button type="button" onclick="appendCharacter('9')">9</button>
            <button type="button" class="operator" onclick="appendCharacter('-')">-</button>

            <button type="button" onclick="appendCharacter('4')">4</button>
            <button type="button" onclick="appendCharacter('5')">5</button>
            <button type="button" onclick="appendCharacter('6')">6</button>
            <button type="button" class="operator" onclick="appendCharacter('+')">+</button>

            <button type="button" onclick="appendCharacter('1')">1</button>
            <button type="button" onclick="appendCharacter('2')">2</button>
            <button type="button" onclick="appendCharacter('3')">3</button>
            <button type="button" class="equal-sign" onclick="calculateResult()">=</button>

            <button type="button" class="zero-btn" onclick="appendCharacter('0')">0</button>
            <button type="button" onclick="appendCharacter('.')">.</button>
        </div>
    </div>

    <script src="JS/Calculator_JS.js"></script>
</body>
</html>
