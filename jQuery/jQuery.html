<!DOCTYPE html>
<html>
    <head>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    </head>
    <body>
        <h1>Basic jQuery</h1>
        <p id="1">Paragraph 1</p>
        <p id="2">Paragraph 2</p>
        <p id="3">Paragraph 3</p>
    <script>
        $(document).ready(function(){
            $("html").append(
                "<body>\
                    <div id='container'>\
                        <div id='inner>'\
                            <h1>Basic jQuery</h1>\
                            <p id='1'>Paragraph 1</p>\
                            <p id='2'>Paragraph 2</p>\
                            <p id='3'>Paragraph 3</p>\
                        </div>\
                    </div>\
                </body>"
            );
            $("#2").css({"color":"red"});
            $("#3").click(function() {
                $('h1').hide();
            });
        });

// Ensure the DOM is fully loaded before executing jQuery code
$(document).ready(function() {
    
    // Attach a click event handler to the button with ID 'myButton'
    $("#myButton").click(function() {
        
        // Show the paragraph message when the button is clicked
        $("#msg").show();
        
    });
    
});
       
// Ensure the DOM is fully loaded before executing jQuery code
$(document).ready(function() {
    
    // Attach a click event handler to the hide button
    $("#hideBtn").click(function() {
        
        // Apply the hide effect to the box element over a duration of 1000ms (1 second)
        $("#box").hide(1000); 
        
    });
    
});

    </script>
    <button id="myButton">Click Me</button>
<p id="msg" style="display:none;">Button was clicked!</p>

<div id="box" style="width:100px; height:100px; background-color:coral;"></div>
<button id="hideBtn">Hide Box</button>
</body>
</html>
